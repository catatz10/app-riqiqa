<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

<title>Riq Iqa Looper</title>
<style>
/* Material Design 3 カラーロール (baseline) */
:root{--primary:#424242;--on-primary:#fff;--pc:#E0E0E0;--on-pc:#1A1A1A;--sec:#E4E4E4;--on-sec:#1A1A1A;
 --tert:#8A8A8A;--surface:#FAFAFA;--sc:#EEEEEE;--sch:#E8E8E8;--on-s:#1C1C1C;--on-sv:#4A4A4A;
 --outline:#7A7A7A;--ov:#C4C4C4;--danger:#FF5449;--inv:#303030;--on-inv:#F2F2F2;--state:rgba(0,0,0,.12);--btn:#C9C9C9}
[data-theme=dark]{--primary:#E0E0E0;--on-primary:#1A1A1A;--pc:#424242;--on-pc:#EEEEEE;--sec:#3A3A3A;--on-sec:#E6E6E6;
 --tert:#9E9E9E;--surface:#121212;--sc:#1E1E1E;--sch:#2A2A2A;--on-s:#E6E6E6;--on-sv:#BDBDBD;
 --outline:#8C8C8C;--ov:#444444;--danger:#FF5449;--inv:#E6E6E6;--on-inv:#303030;--state:rgba(255,255,255,.12);--btn:#4F4F4F}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--surface);color:var(--on-s);font-family:Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.i{width:24px;height:24px;fill:currentColor;flex:none}.i.s{width:20px;height:20px;color:var(--on-sv)}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
/* Top app bar */
.bar{display:flex;align-items:center;gap:4px;padding:4px 8px 0 16px}
.title{flex:1;min-width:0;text-align:left;font-size:22px;line-height:28px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 0}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-sv)}
.ib:active,.rb:active,.seg button:active{background:var(--state)}
/* コントロール行 */
.ctl{display:flex;align-items:center;gap:12px;padding:4px 16px 8px;flex-wrap:wrap}
.fab{width:48px;height:48px;border-radius:16px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.fab.on{background:var(--primary);color:var(--on-primary)}
.tf{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--outline);border-radius:4px;color:var(--on-sv);font-size:14px}
.tf:focus-within{border:2px solid var(--primary);padding:0 11px}
.tf input{border:none;outline:none;background:none;color:var(--on-s);font:inherit;font-size:16px;width:56px}
#grp{width:72px}
.seg{display:flex;align-items:center;gap:8px}
.seg div{display:flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{height:40px;padding:0 16px;font-size:18px;border-left:1px solid var(--outline)}
.seg button:first-child{border-left:none}
.seg button.sel{background:var(--btn);color:var(--on-s);font-weight:bold}
/* M3 スライダー */
input[type=range]{-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0;--v:0%;min-width:120px;flex:1;max-width:260px}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:linear-gradient(to right,var(--primary) var(--v),var(--sec) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:40px;border-radius:2px;background:var(--primary);margin-top:-12px}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;background:var(--sec)}
input[type=range]::-moz-range-progress{height:16px;border-radius:8px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:4px;height:40px;border:none;border-radius:2px;background:var(--primary)}
/* グリッド */
#wrap{overflow:auto;padding:4px 8px 48px}
#g{display:grid;align-items:center;width:max-content}
.ph,.cell{display:flex;justify-content:center;padding:4px}
.alt{background:var(--sc)}
.pill{width:100%;height:20px;border:1px solid var(--outline);border-radius:10px;font-size:11px;text-align:center;line-height:18px;color:var(--on-sv)}
.now .pill{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.corner{position:sticky;left:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:6px;height:100%}
.corner b{min-width:22px;text-align:center;font-weight:500;font-size:16px}
.rb{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--on-s);display:grid;place-items:center}
.lab{position:sticky;left:0;z-index:1;background:var(--surface);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;height:100%;padding-right:6px}
.vs{position:relative;flex:none;width:24px;height:42px;border-radius:12px;background:var(--sec);overflow:hidden;touch-action:pan-x}
.vs i{position:absolute;left:0;right:0;bottom:0;background:var(--primary)}
.c{position:relative;width:42px;height:42px;border-radius:50%;padding:0;touch-action:pan-x;
 border:2px solid var(--ov);background:linear-gradient(to top,var(--primary) var(--p,0%),var(--surface) var(--p,0%))}
.c.on{border-color:var(--primary)}
.now .c{box-shadow:0 0 0 3px var(--tert)}
.c.drag::after{content:attr(data-p);position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--inv);color:var(--on-inv);font-size:12px;padding:2px 8px;border-radius:8px;z-index:5}
/* ダイアログ・スナックバー */
dialog{background:var(--sch);color:var(--on-s);border:none;border-radius:28px;padding:24px;min-width:280px;max-width:90vw}
dialog::backdrop{background:rgba(0,0,0,.32)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.fb{height:48px;min-width:64px;border-radius:24px;background:var(--btn);color:var(--on-s);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:14px;font-weight:500}
.fb.p{background:var(--primary);color:var(--on-primary)}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tag{white-space:nowrap;font-size:14px;font-weight:500;color:var(--on-sv);margin-left:-6px}
.ld.pick{display:flex;align-items:center;gap:12px}
.box{display:grid;place-items:center;flex:none;width:24px;height:24px;border:2px solid var(--outline);border-radius:4px}
.pick.on .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.box .i{width:18px;height:18px}
.warn{margin-left:auto;color:var(--danger);display:grid}
#shCnt{font-size:16px;margin-left:auto;margin-right:4px}
.fb:disabled{opacity:.38}
.cr{font-size:14px;line-height:20px;margin:0 0 12px}.cr a{color:inherit;font-size:12px;word-break:break-all}
dialog[open]{display:flex;flex-direction:column}
dialog{max-height:90vh;max-height:90dvh;overflow:hidden}
dialog>*{flex:none}
#list,#rlist,#credits{flex:1 1 auto;min-height:0;overflow:auto}
#dSet{overflow:auto}
#dSave{margin:12px auto auto}
.ttl{margin:0 0 16px;font-size:22px;line-height:28px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;border:2px solid var(--outline);background:var(--sch);transition:.2s}
.sw span::after{content:'';position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.2s}
.sw input:checked+span{background:var(--primary);border-color:var(--primary)}
.sw input:checked+span::after{top:2px;left:22px;width:24px;height:24px;background:var(--on-primary)}
.sw input:disabled+span{opacity:.4}
.item{display:flex;gap:8px;margin-bottom:8px}.item .ld{flex:1;text-align:left;height:48px;border-radius:12px;background:var(--btn);padding:0 16px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.del{color:var(--danger)}
.ib.del.arm{background:var(--danger);color:#fff}
.fb.danger{background:var(--danger);color:#fff}
#sname{width:100%;height:56px;font-size:16px;padding:0 16px;border:1px solid var(--outline);border-radius:4px;background:none;color:var(--on-s);outline:none;margin-bottom:16px}
#sname:focus{border:2px solid var(--primary);padding:0 15px}
#snack{position:fixed;left:50%;bottom:16px;transform:translate(-50%,80px);background:var(--inv);color:var(--on-inv);border-radius:4px;padding:0 16px;height:48px;display:flex;align-items:center;gap:12px;transition:transform .2s;z-index:120}
#snack.show{transform:translate(-50%,0)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99}
</style></head><body>

<header class="bar">
 <button id="name" class="title">Rhythm Name</button>
 <button class="ib" id="load"><svg class="i"><use href="#i-load"/></svg></button>
 <button class="ib" id="save"><svg class="i"><use href="#i-save"/></svg></button>
 <button class="ib" id="set"><svg class="i"><use href="#i-set"/></svg></button>
</header>
<section class="ctl">
 <button id="play" class="fab"><svg class="i"><use id="pu" href="#i-play"/></svg></button>
 <label class="tf"><span>BPM</span><input id="bpmn" type="number" inputmode="numeric" min="20" max="300" value="100"></label>
 <input id="bpmr" type="range" min="40" max="240" value="100">
 <div class="seg">
  <div id="seg"><button data-d="4">♩</button><button data-d="8">♪</button><button data-d="12">♪₃</button><button data-d="16">♬</button></div></div>
 <label class="tf"><svg class="i s"><use href="#i-grid"/></svg><input id="grp" type="text" inputmode="numeric" placeholder="2+2+3"></label>
</section>
<div id="wrap"><div id="g"></div></div>
<div id="dim"></div><div id="snack"></div>

<dialog id="dSet">
 <div class="row"><button class="fb" id="theme"><svg class="i"><use href="#i-theme"/></svg></button></div>
 <div class="row"><svg class="i s"><use href="#i-sun"/></svg><input id="bright" type="range" min="30" max="100" value="100"></div>
 <div class="row"><svg class="i"><use href="#i-sleep"/></svg><b class="tag">Sleep OFF</b><label class="sw"><input type="checkbox" id="awake"><span></span></label></div>
 <div class="acts" style="justify-content:space-between"><button class="ib" id="info"><svg class="i"><use href="#i-info"/></svg></button><button class="fb p" onclick="dSet.close()"><svg class="i"><use href="#i-check"/></svg></button></div>
</dialog>
<dialog id="dLoad">
 <div class="row" style="margin-bottom:16px"><svg class="i s"><use id="ldIco" href="#i-load"/></svg><span class="ttl" id="ldTtl" style="margin:0">Saved Items</span>
  <b id="shCnt" hidden></b>
  <button class="ib" id="shBtn" style="margin-left:auto"><svg class="i"><use href="#i-share"/></svg></button></div>
 <div id="list"></div>
 <div class="acts" id="actNorm" style="justify-content:space-between;margin-top:8px">
  <div class="acts"><button class="fb" id="exp"><svg class="i"><use href="#i-down"/></svg><span>Backup</span></button>
   <button class="fb" id="imp"><svg class="i"><use href="#i-up"/></svg><span>Import</span></button><input id="file" type="file" accept=".json,application/json" hidden></div>
  <button class="fb" onclick="dLoad.close()"><svg class="i"><use href="#i-close"/></svg></button></div>
 <div class="acts" id="actShare" style="margin-top:8px" hidden>
  <button class="fb" id="shNo"><svg class="i"><use href="#i-close"/></svg></button>
  <button class="fb p" id="shSend" disabled><svg class="i"><use href="#i-share"/></svg></button></div>
</dialog>
<dialog id="dRecv">
 <div class="row" style="margin-bottom:16px"><svg class="i s"><use href="#i-down"/></svg><span class="ttl" style="margin:0">Import</span></div>
 <div id="rlist"></div>
 <div class="acts" style="margin-top:8px"><button class="fb" onclick="dRecv.close()"><svg class="i"><use href="#i-close"/></svg></button>
  <button class="fb p" id="rOk"><svg class="i"><use href="#i-check"/></svg></button></div>
</dialog>
<dialog id="dCred">
 <p class="ttl">Credits</p>
 <div id="credits"></div>
 <div class="acts"><button class="fb" onclick="dCred.close()"><svg class="i"><use href="#i-close"/></svg></button></div>
</dialog>
<dialog id="dOver">
 <p style="margin:0 0 24px;font-size:22px">Overwrite?</p>
 <div class="acts"><button class="fb" id="ovNo"><svg class="i"><use href="#i-close"/></svg></button>
  <button class="fb danger" id="ovYes"><svg class="i"><use href="#i-check"/></svg></button></div>
</dialog>
<dialog id="dSave">
 <p class="ttl">Save as</p>
 <input id="sname" type="text" maxlength="40">
 <div class="acts"><button class="fb" onclick="dSave.close()"><svg class="i"><use href="#i-close"/></svg></button>
  <button class="fb p" id="sok"><svg class="i"><use href="#i-check"/></svg></button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const INST=[['dum','Dum'],['tek','Tek'],['pa','Pa'],['tik','Tik'],['tk','tk']];
const MAX=32;
function fresh(){const s={name:'Rhythm Name',bpm:100,n:5,div:8,grp:'2',pat:{},vol:{}};
 INST.forEach(([k])=>{s.pat[k]=Array(MAX).fill(0);s.vol[k]=0.8});
 [['dum',[0,3]],['tek',[2]],['pa',[1]],['tk',[4]]].forEach(([k,a])=>a.forEach(i=>s.pat[k][i]=1));return s}
let S=fresh();
function toast(ok,t=''){const s=$('snack');s.innerHTML=ico(ok?'check':'err')+`<span>${esc(t)}</span>`;
 s.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove('show'),2200)}
function setV(el){el.style.setProperty('--v',(el.value-el.min)/(el.max-el.min)*100+'%')}

/* ---- 音 (WAVサンプルを再生) ---- */
let ac;const BUF={};
function initAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();
 for(const k in AUDIO){const u=Uint8Array.from(atob(AUDIO[k]),c=>c.charCodeAt(0));
  ac.decodeAudioData(u.buffer).then(b=>BUF[k]=b).catch(()=>{})}}
 if(ac.state!=='running')ac.resume()}
function play(name,t,v){const b=BUF[name];if(!b)return;
 const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=v;
 s.connect(g).connect(ac.destination);s.start(t)}
const stepSec=()=>240/(S.bpm*S.div);   // 1マスの秒数 (BPMは4分音符)
const SND={
 dum:(t,v)=>play('dum',t,v),tek:(t,v)=>play('tek',t,v),pa:(t,v)=>play('pa',t,v),tik:(t,v)=>play('tik',t,v),
 tk:(t,v)=>{play('tk1',t,v);play('tk2',t+stepSec()/2,v)}};   // 1マスの前半 Tik2、後半 Ka
function preview(k,lv){initAudio();if(S.vol[k]*lv>.01)SND[k](ac.currentTime,S.vol[k]*lv)}

/* ---- 再生ループ ---- */
let playing=false,step=0,next=0,timer;
function tick(){
 while(next<ac.currentTime+.1){
  if(step>=S.n)step=0;
  const i=step;
  INST.forEach(([k])=>{const v=S.pat[k][i]*S.vol[k];if(v>.01)SND[k](next,v)});
  setTimeout(()=>hl(i),Math.max(0,(next-ac.currentTime)*1000));
  next+=stepSec();
  step=(step+1)%S.n;
 }}
function hl(i){document.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
 if(i<0||!playing)return;
 document.querySelectorAll(`[data-col="${i}"]`).forEach(e=>e.classList.add('now'))}
$('play').onclick=()=>{initAudio();playing=!playing;
 if(playing){step=0;next=ac.currentTime+.05;tick();timer=setInterval(tick,25)}
 else{clearInterval(timer);hl(-1)}
 if(playing)wlAcquire();else wlRelease();
 $('pu').setAttribute('href',playing?'#i-stop':'#i-play');$('play').classList.toggle('on',playing)};

/* ---- 描画 ---- */
const g=$('g');
function groupIdx(){const a=(S.grp||'').split(/[^0-9]+/).map(Number).filter(x=>x>0);
 if(!a.length)a.push(1);const r=[];let gi=0;
 while(r.length<S.n){for(const s of a){for(let j=0;j<s&&r.length<S.n;j++)r.push(gi);gi++}}return r}
function render(){
 const gi=groupIdx(),alt=i=>gi[i]%2?' alt':'';
 g.style.gridTemplateColumns=`112px repeat(${S.n},56px)`;
 let h=`<div class="corner"><button class="rb" id="dec">${ico('rm')}</button><b>${S.n}</b><button class="rb" id="inc">${ico('add')}</button></div>`;
 for(let i=0;i<S.n;i++)h+=`<div class="ph${alt(i)}" data-col="${i}"><div class="pill">${i+1}</div></div>`;
 INST.forEach(([k,l])=>{
  h+=`<div class="lab"><div class="vs" data-k="${k}"><i style="height:${S.vol[k]*100}%"></i></div><span>${l}</span></div>`;
  for(let i=0;i<S.n;i++){const v=S.pat[k][i]||0;
   h+=`<div class="cell${alt(i)}" data-col="${i}"><button class="c${v?' on':''}" style="--p:${v*100}%" data-k="${k}" data-i="${i}"></button></div>`}});
 g.innerHTML=h;
 $('name').textContent=S.name;$('bpmn').value=S.bpm;$('bpmr').value=S.bpm;setV($('bpmr'));
 $('grp').value=S.grp;
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('sel',+b.dataset.d===S.div))}

g.onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='dec'&&S.n>1){S.n--;render()}
 else if(b.id==='inc'&&S.n<MAX){S.n++;render();$('wrap').scrollLeft=$('wrap').scrollWidth}};
g.oncontextmenu=e=>e.preventDefault();

/* 丸ボタン: タップでON/OFF、押したまま上下/左右にスライドで強弱。音量バーも同様 */
let drag=null,vd=null;
function paint(b,v){b.style.setProperty('--p',v*100+'%');b.classList.toggle('on',v>0)}
g.addEventListener('pointerdown',e=>{
 const vs=e.target.closest('.vs');
 if(vs){e.preventDefault();initAudio();vs.setPointerCapture(e.pointerId);const k=vs.dataset.k;
  vd={vs,k,x:e.clientX,y:e.clientY,base:S.vol[k]};return}
 const b=e.target.closest('.c');if(!b)return;
 e.preventDefault();initAudio();b.setPointerCapture(e.pointerId);
 const k=b.dataset.k,i=+b.dataset.i;
 drag={b,k,i,x:e.clientX,y:e.clientY,base:S.pat[k][i]||0,v:S.pat[k][i]||0,moved:false,cancelled:false}});
g.addEventListener('pointermove',e=>{
 if(vd){const d=-(e.clientY-vd.y);
  const v=Math.min(1,Math.max(0,vd.base+d/120));S.vol[vd.k]=v;
  vd.vs.querySelector('i').style.height=v*100+'%';return}
 if(!drag)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(drag.cancelled)return;
 if(!drag.moved){if(Math.hypot(dx,dy)<8)return;
  if(Math.abs(dx)>Math.abs(dy)){drag.cancelled=true;return}   // 横の動き = スクロール
  drag.moved=true}
 const d=-dy;
 const v=Math.min(1,Math.max(.05,Math.round((drag.base+d/120)*20)/20));
 drag.v=v;S.pat[drag.k][drag.i]=v;paint(drag.b,v);
 drag.b.dataset.p=Math.round(v*100)+'%';drag.b.classList.add('drag')});
function endDrag(e,ok){
 if(vd){const k=vd.k;vd=null;if(ok&&!playing)preview(k,1);return}
 if(!drag)return;const d=drag;drag=null;
 d.b.classList.remove('drag');
 if(!ok){if(d.moved){S.pat[d.k][d.i]=d.base;paint(d.b,d.base)}return}  // スクロールに奪われた場合は元に戻す
 if(d.cancelled)return;
 if(!d.moved){d.v=d.base>0?0:1;S.pat[d.k][d.i]=d.v;paint(d.b,d.v)}
 if(d.v>0&&!playing)preview(d.k,d.v)}
g.addEventListener('pointerup',e=>endDrag(e,true));
g.addEventListener('pointercancel',e=>endDrag(e,false));

/* ---- BPM・1マス・区切り ---- */
$('bpmr').oninput=e=>{S.bpm=+e.target.value;$('bpmn').value=S.bpm;setV(e.target)};
$('bpmn').onchange=e=>{let v=Math.round(+e.target.value)||S.bpm;v=Math.min(300,Math.max(20,v));
 S.bpm=v;$('bpmn').value=v;$('bpmr').value=v;setV($('bpmr'))};
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.div=+b.dataset.d;S.grp=String(S.div/4);render()};
$('grp').onchange=e=>{S.grp=e.target.value;render()};

/* ---- 保存・読込 (この端末のブラウザ内) ---- */
function adopt(sv){const s=fresh(),old=['bass','snare','hihat','tom','rim'],d=sv.div||8;   // 旧データは順番で対応づけ
 Object.assign(s,{name:sv.name,bpm:sv.bpm||100,n:sv.n||5,div:d,grp:sv.grp||String(d/4)});
 INST.forEach(([k],i)=>{const kk=sv.pat&&sv.pat[k]?k:old[i];
  if(sv.pat&&sv.pat[kk])s.pat[k]=sv.pat[kk].concat(Array(MAX).fill(0)).slice(0,MAX);
  if(sv.vol&&sv.vol[kk]!=null)s.vol[k]=sv.vol[kk]});return s}
const KEY='rhythms';
const getAll=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const putAll=a=>{try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}};
$('save').onclick=()=>{$('sname').value=S.name;$('dSave').showModal();$('sname').select()};
let ovAct=null;
function doSave(){const n=$('sname').value.trim();if(!n)return;
 if(getAll()[n]){ovAct=()=>commit(n);$('dOver').showModal();return}
 commit(n)}
function commit(n){S.name=n;const a=getAll();a[n]=JSON.parse(JSON.stringify(S));
 const ok=putAll(a);$('dSave').close();render();toast(ok,ok?n:'')}
$('sok').onclick=doSave;
$('ovNo').onclick=()=>$('dOver').close();
$('ovYes').onclick=()=>{$('dOver').close();if(ovAct)ovAct()};
$('sname').onkeydown=e=>{if(e.key==='Enter')doSave()};
const MAXSHARE=10;
let shareMode=false;const sel=new Set();
function renderList(){const ks=Object.keys(getAll());
 $('list').innerHTML=ks.map(k=>shareMode
  ?`<div class="item"><button class="ld pick${sel.has(k)?' on':''}" data-n="${esc(k)}"><span class="box">${sel.has(k)?ico('check'):''}</span>${esc(k)}</button></div>`
  :`<div class="item"><button class="ld" data-n="${esc(k)}">${esc(k)}</button><button class="ib del" data-n="${esc(k)}">${ico('del')}</button></div>`).join('')}
function updCnt(){$('shCnt').textContent=sel.size+'/'+MAXSHARE;$('shSend').disabled=!sel.size}
function setMode(m){shareMode=m;$('ldIco').setAttribute('href',m?'#i-share':'#i-load');$('ldTtl').textContent=m?'Share':'Saved Items';sel.clear();$('shBtn').hidden=m;$('shCnt').hidden=!m;$('actNorm').hidden=m;$('actShare').hidden=!m;renderList();updCnt()}
function openLoad(){setMode(false);$('dLoad').showModal()}
const openLoadRefresh=renderList;
$('load').onclick=openLoad;$('name').onclick=openLoad;
$('shBtn').onclick=()=>setMode(true);$('shNo').onclick=()=>setMode(false);
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.n,a=getAll();
 if(shareMode){
  if(sel.has(n))sel.delete(n);
  else if(sel.size>=MAXSHARE){toast(false);return}   // 一度に共有できるのは10個まで
  else sel.add(n);
  renderList();updCnt();return}
 if(b.classList.contains('ld')){S=adopt(a[n]);render();$('dLoad').close()}
 else if(b.classList.contains('arm')){delete a[n];putAll(a);renderList()}   // 2回タップで削除
 else{document.querySelectorAll('.del.arm').forEach(x=>x.classList.remove('arm'));b.classList.add('arm');
  setTimeout(()=>b.classList.remove('arm'),3000)}};

/* ---- リンク共有 (データはURLの # 以降に圧縮して格納。サーバーには送られない) ---- */
const b64u={enc:u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
 dec:t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))};
const pack1=r=>[r.name,r.bpm,r.n,r.div,r.grp,
 INST.map(([k])=>Math.round(r.vol[k]*20)).join(','),
 INST.map(([k])=>r.pat[k].slice(0,r.n).map(v=>Math.round(v*20).toString(36)).join('')).join(',')];
function unpack1(a){if(!Array.isArray(a))return null;const s=fresh();
 s.name=String(a[0]||'').slice(0,40).trim();if(!s.name)return null;
 s.bpm=Math.min(300,Math.max(20,+a[1]||100));s.n=Math.min(MAX,Math.max(1,+a[2]||5));
 s.div=[4,8,12,16].includes(+a[3])?+a[3]:8;
 s.grp=String(a[4]||'').replace(/[^0-9+,\s]/g,'').slice(0,20)||String(s.div/4);
 const vv=String(a[5]).split(','),rows=String(a[6]).split(',');
 INST.forEach(([k],i)=>{s.vol[k]=Math.min(1,Math.max(0,(+vv[i]||0)/20));const r=rows[i]||'';
  for(let j=0;j<s.n;j++){const v=parseInt(r[j]||'0',36);s.pat[k][j]=isNaN(v)?0:Math.min(20,v)/20}});
 return s}
async function encodeShare(list){const raw=new TextEncoder().encode(JSON.stringify(list));
 if(window.CompressionStream){const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z'+b64u.enc(new Uint8Array(await new Response(cs).arrayBuffer()))}
 return 'p'+b64u.enc(raw)}
async function decodeShare(t){let u=b64u.dec(t.slice(1));
 if(t[0]==='z'){const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));u=new Uint8Array(await new Response(ds).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(u))}
$('shSend').onclick=async()=>{const a=getAll(),names=[...sel].slice(0,MAXSHARE);if(!names.length)return;
 const code=await encodeShare(names.map(n=>pack1(adopt(a[n]))));
 const url=location.href.split('#')[0]+'#s='+code;
 try{
  if(navigator.share)await navigator.share({title:'Riq Iqa Looper',url});
  else{await navigator.clipboard.writeText(url);toast(true)}
 }catch(e){if(e&&e.name!=='AbortError')toast(false)}
 setMode(false)};

/* 受信: リンクを開いたとき、含まれるリズムを選んで追加 */
let recv=[],rsel=new Set();
function renderRecv(){const a=getAll();
 $('rlist').innerHTML=recv.map((s,i)=>`<div class="item"><button class="ld pick${rsel.has(i)?' on':''}" data-i="${i}"><span class="box">${rsel.has(i)?ico('check'):''}</span>${esc(s.name)}${a[s.name]?`<span class="warn">${ico('err')}</span>`:''}</button></div>`).join('')}
$('rlist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
 rsel.has(i)?rsel.delete(i):rsel.add(i);renderRecv()};
function doRecv(){const a=getAll(),ch=recv.filter((s,i)=>rsel.has(i));
 ch.forEach(s=>a[s.name]=s);const ok=putAll(a);$('dRecv').close();toast(ok,String(ch.length))}
$('rOk').onclick=()=>{const a=getAll(),ch=recv.filter((s,i)=>rsel.has(i));if(!ch.length)return;
 if(ch.some(s=>a[s.name])){ovAct=doRecv;$('dOver').showModal()}else doRecv()};
async function checkHash(){const m=location.hash.match(/^#s=(.+)$/);if(!m)return;
 try{const arr=await decodeShare(m[1]);
  recv=arr.slice(0,MAXSHARE).map(unpack1).filter(Boolean);
  history.replaceState(null,'',location.pathname+location.search);
  if(!recv.length)throw 0;
  rsel=new Set(recv.map((s,i)=>i));renderRecv();$('dRecv').showModal()}
 catch(e){toast(false)}}
addEventListener('hashchange',checkHash);

/* ---- 再生中だけ画面をスリープさせない (Screen Wake Lock) ---- */
let wl=null,wlWarned=false;
async function wlAcquire(){if(!playing||!$('awake').checked||(wl&&!wl.released))return;
 try{wl=await navigator.wakeLock.request('screen')}
 catch(e){if(!wlWarned){wlWarned=true;toast(false)}}}
function wlRelease(){if(wl){wl.release().catch(()=>{});wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wlAcquire()});   // 戻ってきたら再取得
$('awake').onchange=e=>{try{localStorage.setItem('awake',e.target.checked?'1':'0')}catch(x){}
 if(e.target.checked)wlAcquire();else wlRelease()};
try{$('awake').checked=localStorage.getItem('awake')!=='0'}catch(e){$('awake').checked=true}
if(!('wakeLock' in navigator)){$('awake').disabled=true;$('awake').closest('.row').style.opacity=.4}

/* ---- ダイアログの枠外をタップするとキャンセル ---- */
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{
 const r=d.getBoundingClientRect();
 if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}));

$('set').onclick=()=>$('dSet').showModal();

 const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;
 l.download='rhythm-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text()),r=d.rhythms||d,a=getAll();let n=0;
  for(const k in r)if(r[k]&&r[k].pat){a[k]=r[k];n++}
  if(!putAll(a)||!n)throw 0;toast(true,String(n))}
 catch(err){toast(false)}
 e.target.value='';openLoadRefresh()};

 document.documentElement.dataset.theme=d;try{localStorage.setItem('theme',d)}catch(e){}};
$('bright').oninput=e=>{$('dim').style.opacity=(100-e.target.value)/100;setV(e.target)};
setV($('bright'));
try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
try{initAudio()}catch(e){}

checkHash();
